<svg xmlns="http://www.w3.org/2000/svg" width="592" height="840" viewBox="0 0 592 840" role="img" aria-label="Lumifriends A5 guest flyer placeholder">
  <rect width="592" height="840" fill="#f7f5fc"/>
  <rect x="0" y="0" width="592" height="260" fill="#3d11c3"/>
  <g transform="translate(48 56)">
    <rect width="38" height="38" rx="10" fill="#ffd14a"/>
    <text x="52" y="18" fill="#ffffff" font-family="Quicksand, sans-serif" font-size="21" font-weight="700">Lumifriends</text>
    <text x="52" y="36" fill="#ffffff" fill-opacity="0.65" font-family="Quicksand, sans-serif" font-size="13" font-weight="600">by Lumifin</text>
  </g>
  <text x="48" y="184" fill="#ffffff" font-family="Quicksand, sans-serif" font-size="34" font-weight="700">Travelling in Vietnam?</text>
  <text x="48" y="224" fill="#ffd14a" font-family="Quicksand, sans-serif" font-size="34" font-weight="700">Pay by VietQR.</text>

  <rect x="48" y="308" width="240" height="240" rx="16" fill="#ffffff" stroke="#e6e1ef" stroke-width="2"/>
  <text x="168" y="420" text-anchor="middle" fill="#766f86" font-family="Quicksand, sans-serif" font-size="13" font-weight="700" letter-spacing="2">QR CODE</text>
  <text x="168" y="442" text-anchor="middle" fill="#766f86" font-family="Quicksand, sans-serif" font-size="13" font-weight="700" letter-spacing="2">PLACEHOLDER</text>

  <text x="320" y="346" fill="#211a35" font-family="Quicksand, sans-serif" font-size="17" font-weight="700">1 — Scan the code</text>
  <text x="320" y="374" fill="#4e475d" font-family="Quicksand, sans-serif" font-size="14" font-weight="500">Use your phone camera.</text>
  <text x="320" y="418" fill="#211a35" font-family="Quicksand, sans-serif" font-size="17" font-weight="700">2 — Create an account</text>
  <text x="320" y="446" fill="#4e475d" font-family="Quicksand, sans-serif" font-size="14" font-weight="500">No local bank needed.</text>
  <text x="320" y="490" fill="#211a35" font-family="Quicksand, sans-serif" font-size="17" font-weight="700">3 — Pay local merchants</text>
  <text x="320" y="518" fill="#4e475d" font-family="Quicksand, sans-serif" font-size="14" font-weight="500">Straight from your phone.</text>

  <rect x="48" y="596" width="496" height="96" rx="16" fill="#eee9ff"/>
  <text x="296" y="638" text-anchor="middle" fill="#766f86" font-family="Quicksand, sans-serif" font-size="12" font-weight="700" letter-spacing="2">REFERRAL CODE</text>
  <text x="296" y="670" text-anchor="middle" fill="#3d11c3" font-family="Quicksand, sans-serif" font-size="28" font-weight="700" letter-spacing="5">XINCHAO100</text>

  <text x="296" y="742" text-anchor="middle" fill="#4e475d" font-family="Quicksand, sans-serif" font-size="14" font-weight="600">lumifin.io/join/XINCHAO100</text>
  <text x="296" y="792" text-anchor="middle" fill="#766f86" font-family="Quicksand, sans-serif" font-size="10" font-weight="600" letter-spacing="3">A5 GUEST FLYER — PLACEHOLDER ARTWORK</text>
</svg>
